services:
  - type: web
    name: threat-vector-app
    env: python
    buildCommand: pip install -r requirements.txt && python data/seed_db.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
